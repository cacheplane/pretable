name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release — version PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # NOTE: intentionally NO `registry-url`. When set, actions/setup-node
      # writes an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`. With a
      # token configured — even an empty placeholder — npm uses token auth and
      # never attempts the OIDC trusted-publishing exchange, so the registry
      # rejects the publish with a 404. Omitting it leaves no token configured
      # (npm defaults to registry.npmjs.org anyway) and OIDC engages.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm 11.14.1 for trusted publishing OIDC
        run: |
          npm_config_prefix="$RUNNER_TEMP/npm" npm install --global npm@11.14.1
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm/bin/npm" --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:packaging
      - run: pnpm publish:preflight

      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: node ./scripts/publish-configured-packages.mjs
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Trusted publishing (OIDC) stays the intended path — npm prefers it
          # whenever a package has a trusted publisher configured. Without this,
          # any package that does NOT have one falls back to the `_authToken`
          # setup-node wrote into .npmrc, which is its literal placeholder when
          # no token is in the environment, so the publish PUT returns a bare
          # 404. Supplying the existing secret makes that fallback real rather
          # than a placeholder; where OIDC works it goes unused.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Enable auto-merge on Version PR
        if: steps.changesets.outputs.pullRequestNumber != '' && env.RELEASE_GITHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          gh pr merge \
            --auto \
            --squash \
            --repo ${{ github.repository }} \
            ${{ steps.changesets.outputs.pullRequestNumber }}
